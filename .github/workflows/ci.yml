name: Vérifications du projet

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer les dépendances
        run: pip install -e '.[dev,analytics,modeling,api]' 'scikit-learn==1.9.1' 'lightgbm==4.7.0' 'pandas==3.1.1'
      - name: Exécuter les tests Python
        run: python -m pytest -q
      - name: Construire et tester Gold avec dbt
        run: |
          silver_path="$(python scripts/ci_fixture.py data/ci)"
          FRAUD_SILVER_PATH="$silver_path" FRAUD_DUCKDB_PATH=data/ci/gold/ci.duckdb \
            dbt build --project-dir dbt --profiles-dir dbt --no-send-anonymous-usage-stats
      - name: Préparer un modèle et un seuil pour le test Docker
        run: |
          python -m fraud_platform.features --database data/ci/gold/ci.duckdb --output data/ci/transactions.parquet
          python -m fraud_platform.boosted --source data/ci/transactions.parquet
          python -c 'from pathlib import Path; Path("artifacts/lightgbm/threshold_margin.json").write_text("""{"validation":{"threshold":0.5}}""", encoding="utf-8")'
      - name: Construire et tester le conteneur
        run: |
          docker build -f Dockerfile.api -t fraud-detection-api:ci .
          container="$(docker run -d --rm -p 127.0.0.1::8000 fraud-detection-api:ci)"
          trap 'docker logs "$container"; docker stop "$container" >/dev/null' EXIT
          endpoint="$(docker port "$container" 8000/tcp)"
          python scripts/check_container.py "http://$endpoint"
